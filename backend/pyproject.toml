[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — local voice/text personal assistant (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.55",
    "google-genai>=1.0",
    "websockets>=13",
    "mcp>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
